version: '3.8'

services:
  legado-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legado-web
    restart: unless-stopped
    ports:
      - "4080:4080" # Full-screen Vue Web UI
      - "4081:4081" # Transparent HTTP proxy to App (1122)
      - "4082:4082" # Transparent WebSocket proxy to App (1123)
    environment:
      - BACKEND_URL=http://192.168.1.100:1122
      - BACKEND_WS_URL=http://192.168.1.100:1123
