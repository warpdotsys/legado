version: '3.8'

services:
  legado-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legado-web
    restart: unless-stopped
    ports:
      - "4080:4080" # Full-screen Vue Web UI
      - "4081:4081" # Transparent HTTP proxy to JVM WebService (1122)
      - "4082:4082" # Transparent WebSocket proxy to JVM WebSocketServer (1123)
    volumes:
      - ./storage:/storage # Persistent volume for Room database file
